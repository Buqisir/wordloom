name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Node tests and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1. The tag points at this commit.
        # Commit signature verified. action.yml runs.using is node24.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v7.0.0, immutable release. The tag points at this commit.
        # Commit signature verified. action.yml runs.using is node24.
        # Node 24.21.0 is in actions/node-versions for linux x64.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Require Node.js 24.21.0 and npm 11.19.0
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install from lockfiles
        run: |
          npm ci
          npm ci --prefix web

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build:web
